name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build (Release)
        run: dotnet build SellEverything/SellEverything.csproj -c Release --nologo

      - name: Collect plugin zip
        shell: bash
        run: |
          zip=$(find . -name 'latest.zip' -path '*Release*' | head -n1)
          if [ -z "$zip" ]; then
            echo "DalamudPackager latest.zip was not produced."
            echo "Zip files found:"; find . -name '*.zip' || true
            exit 1
          fi
          echo "Using: $zip"
          cp "$zip" SellEverything.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SellEverything
          path: SellEverything.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SellEverything.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
